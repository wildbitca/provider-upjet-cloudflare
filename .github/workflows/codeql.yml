# Analisis estatico (SAST) del codigo Go de este provider.
#
# POR QUE AQUI Y NO EN TODO EL ORG: el code scanning de GitHub es GRATIS en repos
# publicos y de pago (GitHub Advanced Security, por committer activo) en privados. Este
# repo es publico, asi que no cuesta nada. Los repos privados del org —donde estan las
# superficies HTTP reales, pacha-api y elinvo-api— siguen sin SAST a la espera de una
# decision de facturacion, no tecnica.
#
# Los hallazgos van a la pestana Security del repo, no rompen la build: `ci` sigue siendo
# el unico check que gatea el merge.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Lunes 07:00 UTC. El barrido periodico importa: CodeQL mejora sus queries, asi que
    # el mismo codigo sin tocar puede revelar un hallazgo nuevo meses despues.
    - cron: '0 7 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4.33.0
        with:
          languages: go

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4.33.0
