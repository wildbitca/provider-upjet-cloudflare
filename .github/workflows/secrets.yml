# Secret scan over the full git history, via the shared daggerverse/scan module
# (ADR-0003 §2.2: same pinned gitleaks image and flags as org-gitops, business-site
# and pacha-ops). The module picks up `.gitleaks.toml` at the repo root if present.
#
# fetch-depth: 0 is required: scan.gitleaks() refuses a shallow checkout, because a
# depth-1 scan would pass without looking at any history.
name: secrets

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC: weekly full-history sweep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks detect
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | sudo env DAGGER_VERSION=1.0.0-beta.21 BIN_DIR=/usr/local/bin sh
          dagger --progress plain -m https://github.com/wildbitca/daggerverse/scan@cbdca171691bc9c2494eab47d5e82cd23adebfac \
            call gitleaks --source=.
