name: CI

on:
  push:
    branches:
      - main
      - release-*
  pull_request: { }
  workflow_dispatch: { }

permissions:
  contents: read
  pull-requests: write  # for golangci-lint PR annotations
  checks: write

env:
  # Common versions
  GO_VERSION: '1.26'
  GOLANGCI_VERSION: 'v2.11.4'
  DOCKER_BUILDX_VERSION: 'v0.30.1'

jobs:
  detect-noop:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    outputs:
      noop: ${{ steps.noop.outputs.should_skip }}
    steps:
      - name: Detect No-op Changes
        id: noop
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["**.md", "**.png", "**.jpg"]'
          do_not_skip: '["workflow_dispatch", "schedule", "push"]'

  report-breaking-changes:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Get modified CRDs
        id: modified-crds
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47.0.0
        with:
          files: |
            package/crds/**
      - name: Report breaking CRD OpenAPI v3 schema changes
        if: steps.modified-crds.outputs.any_changed == 'true'
        env:
          MODIFIED_CRD_LIST: ${{ steps.modified-crds.outputs.all_changed_files }}
        run: |
          make crddiff
      - name: Report native schema version changes
        if: ${{ inputs.upjet-based-provider }}
        run: |
          make schema-version-diff

  lint:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find the Go Build Cache
        id: go
        run: echo "cache=$(make go.cachedir)" >> $GITHUB_OUTPUT

      - name: Cache the Go Build Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.go.outputs.cache }}
          key: ${{ runner.os }}-provider-upjet-cloudflare-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-provider-upjet-cloudflare-go-

      - name: Cache Go Dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .work/pkg
          key: ${{ runner.os }}-provider-upjet-cloudflare-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-provider-upjet-cloudflare-pkg-

      - name: Vendor Dependencies
        run: make vendor vendor.check

      # We could run 'make lint' but we prefer this action because it leaves
      # 'annotations' (i.e. it comments on PRs to point out linter violations).
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_VERSION }}

  check-diff:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.42.0

      - name: Find the Go Build Cache
        id: go
        run: echo "cache=$(make go.cachedir)" >> $GITHUB_OUTPUT

      - name: Cache the Go Build Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.go.outputs.cache }}
          key: ${{ runner.os }}-provider-upjet-cloudflare-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-provider-upjet-cloudflare-go-

      - name: Cache Go Dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .work/pkg
          key: ${{ runner.os }}-provider-upjet-cloudflare-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-provider-upjet-cloudflare-pkg-

      - name: Vendor Dependencies
        run: make vendor vendor.check

      - name: Check Diff
        run: make check-diff

  unit-tests:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Fetch History
        run: |
          # `git fetch --unshallow` intermittently returns a transient 403 from
          # GitHub; retry so a flaky fetch doesn't red-fail the whole run.
          n=0
          until git fetch --prune --unshallow; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "git fetch --unshallow failed after $n attempts" >&2
              exit 1
            fi
            echo "unshallow attempt $n failed; retrying in $((n * 10))s" >&2
            sleep $((n * 10))
          done

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find the Go Build Cache
        id: go
        run: echo "cache=$(make go.cachedir)" >> $GITHUB_OUTPUT

      - name: Cache the Go Build Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.go.outputs.cache }}
          key: ${{ runner.os }}-provider-upjet-cloudflare-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-provider-upjet-cloudflare-go-

      - name: Cache Go Dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .work/pkg
          key: ${{ runner.os }}-provider-upjet-cloudflare-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-provider-upjet-cloudflare-pkg-

      - name: Vendor Dependencies
        run: make vendor vendor.check

      - name: Run Unit Tests
        run: make -j2 test

      - name: Publish Unit Test Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: unittests
          files: _output/tests/linux_amd64/coverage.txt

  local-deploy:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Fetch History
        run: |
          # `git fetch --unshallow` intermittently returns a transient 403 from
          # GitHub; retry so a flaky fetch doesn't red-fail the whole run.
          n=0
          until git fetch --prune --unshallow; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "git fetch --unshallow failed after $n attempts" >&2
              exit 1
            fi
            echo "unshallow attempt $n failed; retrying in $((n * 10))s" >&2
            sleep $((n * 10))
          done

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find the Go Build Cache
        id: go
        run: echo "cache=$(make go.cachedir)" >> $GITHUB_OUTPUT

      - name: Cache the Go Build Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.go.outputs.cache }}
          key: ${{ runner.os }}-provider-upjet-cloudflare-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-provider-upjet-cloudflare-go-

      - name: Cache Go Dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .work/pkg
          key: ${{ runner.os }}-provider-upjet-cloudflare-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-provider-upjet-cloudflare-pkg-

      - name: Vendor Dependencies
        run: make vendor vendor.check

      - name: Deploying locally built provider package
        run: make local-deploy
