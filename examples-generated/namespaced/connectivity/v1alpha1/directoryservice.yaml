apiVersion: connectivity.upjet-cloudflare.m.upbound.io/v1alpha1
kind: DirectoryService
metadata:
  annotations:
    meta.upbound.io/example-id: connectivity/v1alpha1/directoryservice
  labels:
    testing.upbound.io/example-name: example_connectivity_directory_service
  name: example-connectivity-directory-service
  namespace: crossplane-system
spec:
  forProvider:
    accountId: 023e105f4ecef8ad9ca31a8372d0c353
    host:
      ipv4: 10.0.0.1
      network:
        tunnelIdSelector:
          matchLabels:
            testing.upbound.io/example-name: example
    httpPort: 8080
    httpsPort: 8443
    name: web-app
    tlsSettings:
      certVerificationMode: verify_full
    type: http
