apiVersion: zero.upjet-cloudflare.m.upbound.io/v1alpha1
kind: TrustDeviceCustomProfile
metadata:
  annotations:
    meta.upbound.io/example-id: zero/v1alpha1/trustdevicecustomprofile
  labels:
    testing.upbound.io/example-name: example_zero_trust_device_custom_profile
  name: example-zero-trust-device-custom-profile
  namespace: crossplane-system
spec:
  forProvider:
    accountId: 699d98642c564d2e855e9661899b7252
    allowModeSwitch: true
    allowUpdates: true
    allowedToLeave: true
    autoConnect: 0
    browserExtensionConfig:
      proxyControl: unlocked
      proxyEnabled: true
    captivePortal: 180
    description: Policy for test teams.
    disableAutoFallback: true
    dnsSearchSuffixes:
    - description: Example internal domains
      suffix: internal.corp
    enabled: true
    exclude:
    - address: 192.0.2.0/24
      description: Exclude testing domains from the tunnel
    excludeOfficeIps: true
    globalAcceleration:
      apiEndpoints:
      - 198.51.100.1:443
      enabled: true
      masqueEndpoints:
      - 198.51.100.1:443
      wireguardEndpoints:
      - 198.51.100.1:2408
    include:
    - address: 192.0.2.0/24
      description: Include testing domains in the tunnel
    lanAllowMinutes: 30
    lanAllowSubnetSize: 24
    match: identity.email == "test@cloudflare.com"
    name: Allow Developers
    precedence: 100
    profileType: warp
    registerInterfaceIpWithDns: true
    sccmVpnBoundarySupport: false
    serviceModeV2:
      mode: proxy
      port: 3000
    supportUrl: https://1.1.1.1/help
    switchLocked: true
    tunnelProtocol: wireguard
    uninstallProtection: false
    virtualNetworks:
      allowed:
      - f174e90a-fafe-4643-bbbc-4a0ed4fc8415
      default: f174e90a-fafe-4643-bbbc-4a0ed4fc8415
