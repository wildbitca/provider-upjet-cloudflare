apiVersion: secretsstore.upjet-cloudflare.upbound.io/v1alpha1
kind: StoreSecret
metadata:
  annotations:
    meta.upbound.io/example-id: secretsstore/v1alpha1/storesecret
  labels:
    testing.upbound.io/example-name: example_secrets_store_secret
  name: example-secrets-store-secret
spec:
  forProvider:
    accountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    name: MY_API_KEY
    scopes:
    - workers
    storeIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    valueSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
